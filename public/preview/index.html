<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>手机扫码预览 · 幸运多一点</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared.css" />
  <link rel="stylesheet" href="/mobile/mobile.css" />
  <link rel="stylesheet" href="/preview/preview.css" />
</head>
<body class="preview-page">
  <header class="preview-top">
    <div>
      <h1>手机扫码预览</h1>
      <p>模拟嘉宾扫大屏二维码后，在手机里看到的页面流程（演示用，不连真实房间）。</p>
    </div>
    <div class="preview-actions">
      <a class="btn btn-ghost" href="/screen">返回大屏</a>
      <a class="btn btn-ghost" href="/">首页</a>
    </div>
  </header>

  <div class="preview-layout">
    <aside class="preview-steps">
      <p class="steps-title">流程步骤</p>
      <button type="button" class="step-btn active" data-step="join">1. 填写昵称入场</button>
      <button type="button" class="step-btn" data-step="wait">2. 等待开始</button>
      <button type="button" class="step-btn" data-step="shake">3. 幸运多一点</button>
      <button type="button" class="step-btn" data-step="shaken">4. 已记录名次</button>
      <button type="button" class="step-btn" data-step="result">5. 查看结果</button>
      <p class="steps-note">左侧点选步骤，右侧手机框会切换对应界面。</p>
    </aside>

    <div class="phone-shell">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <main class="mobile-app preview-app">
          <header class="m-brand">
            <div class="brand-mark">幸</div>
            <h1>幸运多一点</h1>
          </header>

          <section class="panel" id="pvJoin">
            <h2>填写昵称入场</h2>
            <p class="hint">昵称将显示在大屏名单上</p>
            <label class="field">
              <span>昵称</span>
              <input value="小明" maxlength="16" readonly />
            </label>
            <p class="room-line">房间：<code>room_demo123</code></p>
            <button class="btn btn-primary btn-block" type="button" tabindex="-1">进入会场</button>
          </section>

          <section class="panel hidden" id="pvWait">
            <div class="big-status">已入场</div>
            <p class="hint">等待主持人开始…</p>
          </section>

          <section class="panel hidden" id="pvShake">
            <div class="shake-orb">
              <div class="orb-ring"></div>
              <div class="orb-core">幸</div>
            </div>
            <h2>幸运多一点 · 猛点冲分</h2>
            <p class="hint">点得越多排名越高</p>
            <button class="btn btn-ghost btn-block" type="button" tabindex="-1">点这里 +1</button>
          </section>

          <section class="panel hidden" id="pvShaken">
            <div class="shake-orb active">
              <div class="orb-ring"></div>
              <div class="orb-core">幸</div>
            </div>
            <h2>已记录 · 第 3 名</h2>
            <p class="hint">继续猛点冲分，请看大屏实时榜</p>
            <button class="btn btn-ghost btn-block" type="button" tabindex="-1" disabled>继续点！</button>
          </section>

          <section class="panel hidden" id="pvResult">
            <p class="reveal-kicker">本轮前五名</p>
            <h2 class="result-prize">第 2 名</h2>
            <p class="result-rank">全场第 2 名 · 点了 86 次</p>
            <p class="hint">昵称：小明</p>
          </section>
        </main>
      </div>
    </div>

    <aside class="preview-caption">
      <h2 id="capTitle">1. 填写昵称入场</h2>
      <p id="capDesc">扫码后首先看到此页。输入昵称并进入会场，大屏「在场」人数增加。</p>
    </aside>
  </div>

  <script src="/preview/preview.js"></script>
</body>
</html>
