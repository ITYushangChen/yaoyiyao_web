<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>幸运多一点 · 大屏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared.css" />
  <link rel="stylesheet" href="/screen/screen.css" />
</head>
<body class="screen-body">
  <div class="screen-bg" id="screenBg" aria-hidden="true">
    <div class="waiting-demo hidden" id="waitingDemo">
      <video
        class="waiting-demo-video"
        id="waitingDemoVideo"
        src="/assets/bg/tap-demo.mp4?v=2-3"
        muted
        loop
        autoplay
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
      ></video>
    </div>
  </div>
  <canvas class="done-fw-canvas hidden" id="doneFwCanvas" aria-hidden="true"></canvas>
  <audio id="bgm" loop preload="auto"></audio>

  <div class="screen-shell">
    <header class="screen-top">
      <div class="brand">
        <div class="brand-mark">幸</div>
        <div>
          <h1>幸运多一点</h1>
        </div>
      </div>
      <div class="screen-logo-wrap">
        <img
          class="screen-logo"
          src="/assets/brand/kaituo-longhai.png?v=2"
          alt="KAITUO LONGHAI"
          width="720"
          height="160"
          decoding="async"
        />
      </div>
      <div class="meta">
        <div class="pill" id="phasePill">等待开始</div>
        <div class="stat">
          <span id="joinedCount">0</span>
          <small>在场</small>
        </div>
      </div>
    </header>

    <main class="screen-main mode-waiting" id="screenMain">
      <section class="stage-panel" id="stagePanel">
        <div class="stage-qr" id="stageQr">
          <p class="qr-badge">扫码入场</p>
          <div class="qr-frame qr-frame-static" id="qrFrame">
            <span class="qr-corner tl"></span>
            <span class="qr-corner tr"></span>
            <span class="qr-corner bl"></span>
            <span class="qr-corner br"></span>
            <div id="qrBox" class="qr-box"></div>
          </div>
          <p class="qr-tip" id="qrTip">手机扫码加入本场</p>
          <p class="qr-wifi-tip hidden" id="qrWifiTip">提前连接wifi: ktlh_内网<br>密码为：Ktlh020329@</p>
        </div>

        <aside class="waiting-roster hidden" id="waitingRoster" aria-live="polite">
          <p class="waiting-roster-title" id="waitingRosterTitle">已入场</p>
          <div class="waiting-roster-list" id="waitingRosterList">
            <div class="waiting-roster-track" id="waitingRosterTrack"></div>
          </div>
          <p class="waiting-roster-empty" id="waitingRosterEmpty">等待扫码加入…</p>
        </aside>

        <div class="round-timer hidden" id="roundTimer" aria-live="polite">
          <div class="round-timer-num" id="roundTimerNum">15</div>
          <p class="round-timer-label" id="roundTimerLabel">秒后开奖</p>
        </div>

        <div class="live-board hidden" id="liveBoard" aria-live="polite">
          <p class="live-board-title" id="liveBoardTitle">实时能量 · Top 20</p>
          <div class="live-board-list" id="liveBoardList"></div>
          <p class="live-board-empty" id="liveBoardEmpty">等待点击…冲上榜首！</p>
        </div>

        <div class="stage-idle hidden" id="stageIdle">
          <h2 id="stageTitle">等待下一段揭晓</h2>
          <p id="stageDesc">请点击下方「开始倒计时」继续。</p>
          <div class="joined-cloud" id="joinedCloud"></div>
        </div>

        <div class="stage-roll hidden" id="stageRoll">
          <div class="roll-live" id="rollLive">
            <div class="roll-half roll-half-top" id="rollHalfTop">
              <p class="roll-step" id="rollStep">即将揭晓</p>
              <h2 class="roll-prize" id="rollPrize">冲榜进行中</h2>
              <div class="roll-countdown" id="rollCountdown">3</div>
              <p class="roll-countdown-label" id="rollCountdownLabel">预备…</p>
            </div>
            <div class="roll-half roll-half-bottom hidden" id="rollHalfBottom">
              <p class="roll-names-label" id="rollNamesLabel">实时冲榜 · Top 20</p>
              <div class="roll-chart" id="rollChart" aria-live="polite"></div>
            </div>
          </div>
          <div class="roll-final hidden" id="rollFinal">
            <p class="roll-final-kicker">本轮前五名</p>
            <div class="roll-winners-all" id="rollWinners"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="screen-controls">
      <button class="btn btn-accent" id="btnStart" type="button">开始幸运多一点</button>
      <button class="btn btn-primary hidden" id="btnCountdown" type="button" disabled>提前开奖</button>
      <button class="btn btn-ghost btn-danger" id="btnReset" type="button">重置本轮</button>
      <span class="status-msg" id="statusMsg"></span>
    </footer>
  </div>

  <script src="/vendor/qrcode.min.js"></script>
  <script src="/screen/screen.js"></script>
</body>
</html>
