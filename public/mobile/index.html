<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>幸运多一点</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared.css" />
  <link rel="stylesheet" href="/mobile/mobile.css" />
</head>
<body class="is-mobile">
  <main class="mobile-app">
    <header class="m-brand">
      <div class="brand-mark">幸</div>
      <h1>幸运多一点</h1>
    </header>

    <section class="panel" id="panelJoin">
      <h2>填写昵称入场</h2>
      <p class="hint">昵称将显示在大屏中奖名单上</p>
      <label class="field">
        <span>昵称</span>
        <input id="nickname" maxlength="16" placeholder="例如：小明" autocomplete="nickname" />
      </label>
      <p class="room-line">房间：<code id="roomLabel">—</code></p>
      <button class="btn btn-primary btn-block" id="btnJoin" type="button">进入会场</button>
      <p class="msg" id="joinMsg"></p>
    </section>

    <section class="panel hidden" id="panelWait">
      <div class="big-status" id="waitStatus">已入场</div>
      <p class="hint" id="waitHint">等待主持人开始…</p>
    </section>

    <section class="panel panel-shake hidden" id="panelShake">
      <p class="m-start-cd hidden" id="mStartCd" aria-live="polite">
        <span class="m-start-cd-num" id="mStartCdNum">3</span>
        <span class="m-start-cd-label" id="mStartCdLabel">预备…</span>
      </p>
      <p class="m-round-timer hidden" id="mRoundTimer" aria-live="polite">
        <span class="m-round-timer-num" id="mRoundTimerNum">15</span>
        <span class="m-round-timer-label" id="mRoundTimerLabel">秒后开奖</span>
      </p>
      <div class="shake-arena" id="shakeArena">
        <div class="shake-orb is-bounce" id="shakeOrb" role="button" tabindex="0" aria-label="点击计数">
          <div class="orb-ring"></div>
          <div class="orb-fill" id="orbFill" aria-hidden="true"></div>
          <div class="orb-core">
            <span class="orb-count" id="orbCount">0</span>
            <span class="orb-unit">次</span>
          </div>
          <div class="tap-fx" id="tapFx" aria-hidden="true"></div>
        </div>
        <button class="btn btn-primary btn-tap" id="btnManualShake" type="button">点这里 +1</button>
      </div>
      <h2 id="shakeTitle">幸运多一点 · 猛点冲分</h2>
      <p class="hint" id="shakeHint">只看自己的次数 · 点得越多排名越高</p>
    </section>

    <section class="panel hidden" id="panelReveal">
      <div class="m-roll-live" id="mRollLive">
        <div class="m-roll-top">
          <p class="m-roll-step" id="mRollStep">即将揭晓</p>
          <h2 class="m-roll-prize" id="mRollPrize">冲榜进行中</h2>
          <div class="m-roll-countdown" id="mRollCountdown">3</div>
          <p class="m-roll-label" id="mRollLabel">预备…</p>
        </div>
        <div class="m-roll-bottom hidden" id="mRollBottom">
          <p class="m-roll-names-label" id="mRollNamesLabel">实时冲榜 · Top 20</p>
          <div class="m-roll-chart" id="mRollChart"></div>
        </div>
      </div>
      <div class="m-roll-final hidden" id="mRollFinal">
        <p class="reveal-kicker">本轮前五名</p>
        <div class="m-winners-all" id="mRollWinners"></div>
        <p class="hint" id="mMyResultHint"></p>
      </div>
    </section>

    <section class="panel panel-congrats hidden" id="panelResult">
      <canvas class="fw-canvas" id="fwCanvas" aria-hidden="true"></canvas>
      <div class="congrats-body">
        <p class="reveal-kicker" id="resultKicker">恭喜上榜</p>
        <p class="congrats-emoji" aria-hidden="true">✦</p>
        <h2 class="result-prize" id="resultPrize">恭喜你！</h2>
        <p class="result-rank" id="resultRank">你是第 — 名</p>
        <p class="hint result-meta" id="resultName"></p>
      </div>
    </section>
  </main>

  <script src="/mobile/mobile.js"></script>
</body>
</html>
